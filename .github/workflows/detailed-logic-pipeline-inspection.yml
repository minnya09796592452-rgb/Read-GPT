name: Detailed Logic Pipeline Inspection

on:
  push:
    branches: [main]
    paths:
      - 'reports/NYAMIST_LOGIC_PARTS_DETAILED_20261115.zip'
      - 'tools/inspect_logic_pipeline_zip.py'
      - '.github/workflows/detailed-logic-pipeline-inspection.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detailed-logic-pipeline-inspection-main
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and inspect every TXT report
        run: python tools/inspect_logic_pipeline_zip.py
      - name: Commit inspection reports
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/logic_pipeline_inspection.md reports/logic_pipeline_inspection.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add detailed logic pipeline inspection report'
            git push origin HEAD:main
          else
            echo 'Inspection reports unchanged.'
          fi
